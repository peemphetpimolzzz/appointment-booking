# Overlay for the test stack. Use together with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --build --rm integration-tests
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm e2e
name: appointment-booking

services:
  # Dedicated Postgres for integration tests so they never touch the dev database.
  # No host port — it is only reachable inside the compose network.
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  integration-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@test-db:5432/${POSTGRES_DB}?schema=public"
    depends_on:
      test-db:
        condition: service_healthy
    # Apply the schema (incl. the GiST EXCLUDE constraint) then run the suite.
    entrypoint: ["sh", "-c", "npx prisma migrate deploy && npm run test:integration"]

  e2e:
    build:
      context: ./e2e
    environment:
      BASE_URL: http://web:80
    depends_on:
      web:
        condition: service_healthy
